[package]
name = "z-tenant-ar"
version = "0.1.0"
edition = "2021"
description = "Accounts-receivable reminder agent for T3N — invoices in a tenant KV map (PII rejected at parse time), payment reminders sent via host:interfaces/http-with-placeholders so customer name/email resolve inside the enclave"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wit-bindgen = { version = "0.49", default-features = false, features = ["macros", "realloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
